<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <!-- Shield Metallic Gradient Left -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121c36" />
      <stop offset="100%" stop-color="#0a1122" />
    </linearGradient>

    <!-- Shield Metallic Gradient Right -->
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24345d" />
      <stop offset="100%" stop-color="#131d37" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Glow -->
    <radialGradient id="irisCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f5ff" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0b101b" />
    </radialGradient>
  </defs>

  <!-- 1. Base Squircle Canvas (22% radius = 225px) -->
  <rect x="16" y="16" width="992" height="992" rx="225" ry="225" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="12" />

  <!-- Subtle Inner Rim Glow -->
  <rect x="32" y="32" width="960" height="960" rx="210" ry="210" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.4" />

  <!-- 2. Cybernetic Shield Geometry -->
  <g transform="translate(512, 490)">
    <!-- Left Facet -->
    <polygon points="0,-250 -240,-210 -240,60 0,310" fill="url(#shieldLeft)" stroke="#00f5ff" stroke-width="4" filter="url(#neonGlow)" />
    <!-- Right Facet -->
    <polygon points="0,-250 240,-210 240,60 0,310" fill="url(#shieldRight)" stroke="#8b5cf6" stroke-width="4" filter="url(#neonGlow)" />

    <!-- Center Spine Divider -->
    <line x1="0" y1="-250" x2="0" y2="310" stroke="#00f5ff" stroke-width="5" />

    <!-- Inner Facet Bevel -->
    <polygon points="0,-200 -200,-170 -200,40 0,255" fill="#090e1c" fill-opacity="0.8" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.5" />
    <polygon points="0,-200 200,-170 200,40 0,255" fill="#0d152b" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5" />

    <!-- High-Tech Circuit Traces -->
    <path d="M -180,-60 L -120,-60 L -80,-20" fill="none" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
    <circle cx="-180" cy="-60" r="5" fill="#00f5ff" />
    <path d="M 180,-60 L 120,-60 L 80,-20" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
    <circle cx="180" cy="-60" r="5" fill="#8b5cf6" />

    <path d="M -70,200 L -30,240" fill="none" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" />
    <circle cx="-70" cy="200" r="4" fill="#00f5ff" />
    <path d="M 70,200 L 30,240" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
    <circle cx="70" cy="200" r="4" fill="#8b5cf6" />

    <!-- 3. Autonomous AI Sentinel Eye Core -->
    <!-- Hexagonal Reticle -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#00f5ff" stroke-width="4" stroke-opacity="0.8" />
    
    <!-- Concentric Rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#8b5cf6" stroke-width="5" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00f5ff" stroke-width="4" />
    
    <!-- Central Core -->
    <circle cx="0" cy="0" r="32" fill="url(#irisCore)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Crosshair HUD Ticks -->
    <line x1="-120" y1="0" x2="-90" y2="0" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" />
    <line x1="90" y1="0" x2="120" y2="0" stroke="#00f5ff" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-120" x2="0" y2="-90" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="90" x2="0" y2="120" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
